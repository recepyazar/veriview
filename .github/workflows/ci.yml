name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install VeriView and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys
          npm install -g netlistsvg
          pip install -e '.[dev]'
          veriview --install-deps -y   # installs sv2v into ~/.local/bin

      - name: Lint
        run: make lint

      - name: Test
        run: make test
