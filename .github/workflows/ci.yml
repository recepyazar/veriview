name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Recent Yosys (Ubuntu's apt package is too old for some features)
      - uses: YosysHQ/setup-oss-cad-suite@v3

      - name: Install VeriView and dependencies
        run: |
          yosys -V
          npm install -g netlistsvg
          pip install -e '.[dev]'
          veriview --install-deps -y   # installs sv2v into ~/.local/bin

      - name: Lint
        run: make lint

      - name: Test
        run: make test
