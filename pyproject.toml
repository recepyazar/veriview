[build-system]
requires = ["hatchling>=1.26", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

[project]
name = "veriview"
dynamic = ["version", "readme"]
description = "Schematics, an interactive viewer and a logic simulator for Verilog/SystemVerilog, built on Yosys and netlistsvg"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Recep Salih" }]
requires-python = ">=3.9"
keywords = ["verilog", "systemverilog", "yosys", "netlistsvg", "schematic", "eda", "simulation", "waveform", "rtl"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
veriview = "veriview.cli:main"

[project.urls]
Homepage = "https://github.com/recepyazar/veriview"
Documentation = "https://github.com/recepyazar/veriview#readme"
Issues = "https://github.com/recepyazar/veriview/issues"
Changelog = "https://github.com/recepyazar/veriview/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/veriview/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/veriview"]

[tool.hatch.build.targets.sdist]
exclude = ["/results", "/docs", "/.github", "/veriview.sh"]

# PyPI does not resolve relative links: rewrite them to GitHub for the package page only.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(src|href)="\./'
replacement = '\1="https://raw.githubusercontent.com/recepyazar/veriview/main/'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#)\.?/?([^)]+)\)'
replacement = '](https://github.com/recepyazar/veriview/blob/main/\1)'

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["tools: needs yosys and netlistsvg", "sv: needs sv2v or yosys-slang"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
