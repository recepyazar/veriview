<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VeriView · Gate editor</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --border: #dde1e6; --text: #1d232b; --muted: #5f6b7a;
    --accent: #2563eb; --on-accent: #ffffff; --accent-soft: #e6eefc; --paper: #ffffff; --grid: #e3e6ea;
    --wire: #344054; --sel: #e8590c; --bad: #d92d20; --ok: #15a34a; --label: #0e7490;
  }
  :root[data-theme="dark"] {
    --bg: #111418; --panel: #181c21; --border: #2a3038; --text: #e6e9ed; --muted: #95a0ad;
    --accent: #6ea0ff; --on-accent: #0b1220; --accent-soft: #1c2a42; --paper: #15181c; --grid: #262c34;
    --wire: #c9d1db; --sel: #fb923c; --bad: #f97066; --ok: #4ade80; --label: #67e8f9;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111418; --panel: #181c21; --border: #2a3038; --text: #e6e9ed; --muted: #95a0ad;
      --accent: #6ea0ff; --on-accent: #0b1220; --accent-soft: #1c2a42; --paper: #15181c; --grid: #262c34;
      --wire: #c9d1db; --sel: #fb923c; --bad: #f97066; --ok: #4ade80; --label: #67e8f9;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: 190px 1fr 36%;
    grid-template-areas: "head head head" "pal canvas code" "foot foot foot";
    background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button, input, select { font: inherit; color: inherit; }
  header { grid-area: head; display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  header .brand { font-weight: 700; }
  header .brand small { color: var(--muted); font-weight: 400; margin-left: 4px; }
  header input { padding: 3px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel); width: 150px; }
  .spacer { flex: 1; }
  .btn { border: 1px solid var(--border); background: var(--panel); border-radius: 6px; padding: 4px 10px; cursor: pointer; white-space: nowrap; }
  .btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .btn:disabled { opacity: 0.45; cursor: default; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  .btn.primary:hover:not(:disabled) { color: var(--on-accent); filter: brightness(1.08); }
  .btn.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  aside { grid-area: pal; background: var(--panel); border-right: 1px solid var(--border); padding: 10px; overflow: auto; }
  aside h3 { margin: 6px 0; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  aside .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 10px; }
  aside .btn { padding: 6px 4px; font-size: 13px; }
  aside .help { font-size: 12px; color: var(--muted); line-height: 1.5; margin-top: 10px; }
  #props { border: 1px solid var(--border); border-radius: 8px; padding: 8px; font-size: 13px; margin-bottom: 6px; }
  #props .what { color: var(--muted); margin-bottom: 6px; }
  #props label { display: block; color: var(--muted); font-size: 12px; margin: 6px 0 2px; }
  #props input[type="text"] { width: 100%; padding: 3px 6px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); font-family: ui-monospace, Menlo, monospace; }
  #props input.bad { border-color: var(--bad); }
  #props .row { display: flex; gap: 4px; }
  #props .row .btn { flex: 1; padding: 2px 0; }
  #canvas { grid-area: canvas; position: relative; background: var(--paper); overflow: hidden; touch-action: none; }
  #canvas.panning { cursor: grab; }
  #canvas svg { width: 100%; height: 100%; display: block; user-select: none; }
  .node .body { fill: var(--paper); stroke: var(--wire); stroke-width: 2; }
  .node.sel .body { stroke: var(--sel); stroke-width: 3; }
  .node text { fill: var(--text); font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; pointer-events: none; }
  .node text.kind { fill: var(--muted); font-size: 10px; }
  .node text.lbl, text.wlbl { fill: var(--label); font: bold 11px ui-monospace, SFMono-Regular, Menlo, monospace; pointer-events: none; }
  .node { cursor: move; }
  .pin { fill: var(--paper); stroke: var(--wire); stroke-width: 1.5; cursor: crosshair; }
  .pin:hover, .pin.hot { fill: var(--accent); stroke: var(--accent); }
  .pin.free { stroke: var(--bad); }
  .wire { fill: none; stroke: var(--wire); stroke-width: 2; }
  .wire-hit { fill: none; stroke: transparent; stroke-width: 10; cursor: pointer; }
  .wire.sel { stroke: var(--sel); stroke-width: 3; }
  .wire.temp { stroke: var(--accent); stroke-dasharray: 5 4; }
  .rubber { fill: var(--accent); fill-opacity: 0.08; stroke: var(--accent); stroke-dasharray: 4 3; }
  #code { grid-area: code; display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-left: 1px solid var(--border); }
  #code .head { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-bottom: 1px solid var(--border); font-size: 13px; }
  #verilog { flex: 1; margin: 0; overflow: auto; padding: 10px 12px; font: 12.5px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre; }
  #warnings { border-top: 1px solid var(--border); padding: 6px 10px; font-size: 12.5px; max-height: 25%; overflow: auto; }
  #warnings:empty { display: none; }
  #warnings div { color: var(--bad); }
  #verilog .k { color: #7c3aed; font-weight: 600; } #verilog .c { color: #6b7280; font-style: italic; } #verilog .n { color: #0e7490; }
  footer { grid-area: foot; padding: 5px 12px; color: var(--muted); border-top: 1px solid var(--border); background: var(--panel); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  footer b { color: var(--text); }
  [hidden] { display: none !important; }
  @media (max-width: 860px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto auto 60vh auto auto; grid-template-areas: "head" "pal" "canvas" "code" "foot"; }
    aside .grid { grid-template-columns: repeat(4, 1fr); }
    #code { max-height: 45vh; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">VeriView<small data-t>Gate editor</small></div>
  <label><span data-t>Module</span> <input id="modname" value="my_design" spellcheck="false"></label>
  <button class="btn" id="b-undo" title="Undo (Ctrl+Z)">↶</button>
  <button class="btn" id="b-redo" title="Redo (Ctrl+Y)">↷</button>
  <span class="spacer"></span>
  <button class="btn" id="b-new" data-t>New</button>
  <button class="btn" id="b-load" data-t>Load…</button>
  <button class="btn" id="b-save" data-t>Save design</button>
  <button class="btn" id="b-v" data-t>Download Verilog</button>
  <button class="btn primary" id="b-open" title="Save the Verilog file in the folder and open it in the viewer (simulation, timing, FSM…)" data-t>▶ Save &amp; open in viewer</button>
  <button class="btn" id="btn-lang" title="Language / Dil">TR</button>
  <button class="btn" id="btn-theme" title="Toggle light/dark theme">◐</button>
  <input type="file" id="file" accept=".json,application/json" hidden>
</header>
<aside>
  <h3 data-t>Ports</h3>
  <div class="grid">
    <button class="btn" data-add="in" data-t>Input</button><button class="btn" data-add="out" data-t>Output</button>
    <button class="btn" data-add="const0">0</button><button class="btn" data-add="const1">1</button>
  </div>
  <h3 data-t>Gates</h3>
  <div class="grid">
    <button class="btn" data-add="not">NOT</button><button class="btn" data-add="buf">BUF</button>
    <button class="btn" data-add="and">AND</button><button class="btn" data-add="or">OR</button>
    <button class="btn" data-add="nand">NAND</button><button class="btn" data-add="nor">NOR</button>
    <button class="btn" data-add="xor">XOR</button><button class="btn" data-add="xnor">XNOR</button>
    <button class="btn" data-add="mux">MUX</button>
  </div>
  <h3 data-t>Flip-flops</h3>
  <div class="grid">
    <button class="btn" data-add="dff">DFF</button><button class="btn" data-add="dffr" title="DFF with active-low asynchronous reset">DFF+R</button>
  </div>
  <h3 data-t>Selection</h3>
  <div id="props"></div>
  <div class="help" id="help"></div>
</aside>
<div id="canvas"></div>
<section id="code">
  <div class="head"><b>Verilog</b><span class="spacer"></span><button class="btn" id="b-copy" data-t>Copy</button></div>
  <pre id="verilog"></pre>
  <div id="warnings"></div>
</section>
<footer id="status"></footer>
<script>
/*__EDITOR_CORE__*/
</script>
<script>
const EDITOR = /*__EDITOR_DATA__*/null;
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const SVGNS = "http://www.w3.org/2000/svg";
  // ---- language -------------------------------------------------------------------------
  const TR = {
    "Gate editor": "Kapı editörü", "Module": "Modül", "New": "Yeni", "Load…": "Aç…", "Save design": "Tasarımı kaydet",
    "Download Verilog": "Verilog'u indir", "▶ Save & open in viewer": "▶ Kaydet ve görüntüleyicide aç",
    "Save the Verilog file in the folder and open it in the viewer (simulation, timing, FSM…)":
      "Verilog dosyasını klasöre kaydet ve görüntüleyicide aç (simülasyon, zamanlama, FSM…)",
    "Toggle light/dark theme": "Açık / koyu tema", "Ports": "Portlar", "Input": "Giriş", "Output": "Çıkış", "Gates": "Kapılar",
    "Flip-flops": "Flip-flop'lar", "DFF with active-low asynchronous reset": "Aktif-düşük asenkron reset'li DFF", "Copy": "Kopyala",
    "Selection": "Seçim", "Undo (Ctrl+Z)": "Geri al (Ctrl+Z)", "Redo (Ctrl+Y)": "Yinele (Ctrl+Y)",
    "help": "<b>Ekle:</b> soldaki düğmeler · <b>Seç:</b> tıkla, Shift/Ctrl+tık ile ekle, boş alanda sürükleyerek kutu çiz · " +
      "<b>Taşı:</b> sürükle · <b>Bağla:</b> pinden pine sürükle · <b>Kaydır:</b> Boşluk+sürükle ya da orta tuş · <b>Yakınlaştır:</b> tekerlek<br>" +
      "<b>Kısayollar:</b> Ctrl+A tümü · Ctrl+C/X/V kopyala/kes/yapıştır · Ctrl+D çoğalt · Ctrl+Z/Y geri al/yinele · Delete sil · Esc seçimi bırak · Çift tık: isim",
    "Name for this port": "Bu port için isim", "Copied.": "Kopyalandı.", "Saved {f}; opening the viewer…": "{f} kaydedildi; görüntüleyici açılıyor…",
    "Saving and opening needs the launcher (run `veriview` or `veriview --editor`). Use Download Verilog instead.":
      "Kaydedip açmak için launcher gerekli (`veriview` ya da `veriview --editor`). Bunun yerine Verilog'u indir.",
    "{n} gates, {m} wires": "{n} kapı, {m} tel", "Start: add an input, a gate and an output, then drag from pin to pin.":
      "Başla: bir giriş, bir kapı ve bir çıkış ekle, sonra pinden pine sürükle.",
    "Delete the whole design?": "Tüm tasarım silinsin mi?", "File name (in the launcher folder):": "Dosya adı (launcher klasöründe):",
    "{f} exists. Overwrite?": "{f} zaten var. Üzerine yazılsın mı?", "Not a VeriView design file.": "VeriView tasarım dosyası değil.",
    "unconnected input {pin} of {node} (tied to 0)": "{node} kapısının {pin} girişi bağlı değil (0'a bağlandı)",
    "output {name} is not driven (tied to 0)": "{name} çıkışı sürülmüyor (0'a bağlandı)",
    "combinational loop through {list}": "{list} üzerinden kombinasyonel döngü",
    "duplicate port name {name}": "port adı tekrarlanıyor: {name}", "no ports yet": "henüz port yok",
    "invalid name {name} (letters, digits, _; not a keyword)": "geçersiz isim {name} (harf, rakam, _; anahtar kelime olamaz)",
    "name {name} is used twice": "{name} ismi iki kez kullanılıyor", "{n} warning(s)": "{n} uyarı",
    "Nothing selected.": "Hiçbir şey seçili değil.", "{n} items selected": "{n} öğe seçili",
    "Name": "İsim", "Port name": "Port adı", "Net name (the wire this gate drives)": "Net adı (bu kapının sürdüğü tel)",
    "Net name (all wires from this output)": "Net adı (bu çıkıştan çıkan tüm teller)",
    "Inputs": "Giriş sayısı", "Value": "Değer", "This wire comes from input {name}: rename the input port.": "Bu tel {name} girişinden geliyor: giriş portunu yeniden adlandır.",
    "Constant wires have no name.": "Sabit tellerin ismi olmaz.", "automatic": "otomatik",
    "Copied {n} items.": "{n} öğe kopyalandı.", "Cut {n} items.": "{n} öğe kesildi.", "Pasted {n} items.": "{n} öğe yapıştırıldı.",
    "wire": "tel",
  };
  let LANG = "en";
  try { LANG = ((localStorage.getItem("veriview-lang") || navigator.language || "") + "").toLowerCase().startsWith("tr") ? "tr" : "en"; } catch (e) {}
  const _t = (s, v) => { let o = LANG === "tr" && TR[s] !== undefined ? TR[s] : s; if (v) for (const [k, x] of Object.entries(v)) o = o.split(`{${k}}`).join(String(x)); return o; };
  document.documentElement.lang = LANG;
  for (const el of document.querySelectorAll("[data-t]")) el.textContent = _t(el.textContent.trim());
  for (const el of document.querySelectorAll("[title]")) el.title = _t(el.title);
  $("help").innerHTML = LANG === "tr" ? TR.help :
    "<b>Add:</b> buttons on the left · <b>Select:</b> click, Shift/Ctrl+click to add, drag on empty space for a box · " +
    "<b>Move:</b> drag · <b>Connect:</b> drag from pin to pin · <b>Pan:</b> Space+drag or middle button · <b>Zoom:</b> wheel<br>" +
    "<b>Keys:</b> Ctrl+A all · Ctrl+C/X/V copy/cut/paste · Ctrl+D duplicate · Ctrl+Z/Y undo/redo · Delete · Esc deselect · Double-click: name";
  $("btn-lang").textContent = LANG === "tr" ? "EN" : "TR";
  $("btn-lang").onclick = () => { try { localStorage.setItem("veriview-lang", LANG === "tr" ? "en" : "tr"); } catch (e) {} location.reload(); };
  const root = document.documentElement;
  try { const th = localStorage.getItem("veriview-theme"); if (th) root.dataset.theme = th; } catch (e) {}
  $("btn-theme").onclick = () => {
    const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark";
    try { localStorage.setItem("veriview-theme", root.dataset.theme); } catch (e) {}
  };

  // ---- model ----------------------------------------------------------------------------
  // node: {id, type, x, y, name? (ports), label? (net a gate drives), n? (inputs)};
  // wire: {id, from: {node, pin}, to: {node, pin}} (from = an output pin)
  const { GATE2, pinsOf } = VVEditor;
  const PORTS = ["in", "out", "const0", "const1"];
  const sizeOf = (nd) => {
    if (nd.type === "in" || nd.type === "out") return { w: 70, h: 30 };
    if (nd.type.startsWith("const")) return { w: 36, h: 30 };
    if (nd.type === "dff" || nd.type === "dffr") return { w: 70, h: nd.type === "dffr" ? 80 : 64 };
    if (nd.type === "mux") return { w: 50, h: 70 };
    const n = pinsOf(nd).ins.length;
    return { w: 64, h: Math.max(40, 20 * n + 4) };
  };
  const pinPos = (nd, pin, isOut) => {
    const { w, h } = sizeOf(nd), p = pinsOf(nd);
    if (isOut) return { x: nd.x + w, y: nd.y + h / 2 };
    if (nd.type === "mux" && pin === "S") return { x: nd.x + w / 2, y: nd.y + h - 6 };
    const ins = nd.type === "mux" ? ["A", "B"] : p.ins;
    const i = ins.indexOf(pin);
    return { x: nd.x, y: nd.y + (h * (i + 1)) / (ins.length + 1) };
  };
  let D = { nodes: [], wires: [], seq: 1 };
  const STORE = "veriview-editor1", CLIP = "veriview-editor-clip1";
  const byId = () => Object.fromEntries(D.nodes.map((n) => [n.id, n]));
  const sel = { nodes: new Set(), wires: new Set() };
  const clearSel = () => { sel.nodes.clear(); sel.wires.clear(); };
  const selCount = () => sel.nodes.size + sel.wires.size;

  // ---- undo / redo ------------------------------------------------------------------------
  const hist = { undo: [], redo: [] };
  const snapshot = () => JSON.stringify({ D, module: $("modname").value });
  let last = null;
  function commit() {           // call after every change: records history and saves
    const now = snapshot();
    if (now === last) return;
    if (last !== null) { hist.undo.push(last); if (hist.undo.length > 200) hist.undo.shift(); hist.redo.length = 0; }
    last = now;
    try { localStorage.setItem(STORE, JSON.stringify({ ...D, module: $("modname").value })); } catch (e) {}
    updateUndo();
  }
  function restore(snap) {
    const s = JSON.parse(snap);
    D = s.D; $("modname").value = s.module; last = snap;
    for (const id of [...sel.nodes]) if (!D.nodes.some((n) => n.id === id)) sel.nodes.delete(id);
    for (const id of [...sel.wires]) if (!D.wires.some((w) => w.id === id)) sel.wires.delete(id);
    try { localStorage.setItem(STORE, JSON.stringify({ ...D, module: $("modname").value })); } catch (e) {}
    draw(); updateUndo();
  }
  const undo = () => { if (!hist.undo.length) return; hist.redo.push(last); restore(hist.undo.pop()); };
  const redo = () => { if (!hist.redo.length) return; hist.undo.push(last); restore(hist.redo.pop()); };
  const updateUndo = () => { $("b-undo").disabled = !hist.undo.length; $("b-redo").disabled = !hist.redo.length; };
  $("b-undo").onclick = undo; $("b-redo").onclick = redo;

  // ---- view (pan / zoom) ------------------------------------------------------------------
  const svg = document.createElementNS(SVGNS, "svg");
  $("canvas").append(svg);
  let vb = { x: 0, y: 0, w: 1000, h: 700 };
  const setVB = () => svg.setAttribute("viewBox", `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  const fitAspect = () => { const r = $("canvas").getBoundingClientRect(); if (r.width && r.height) { vb.h = vb.w * r.height / r.width; setVB(); } };
  new ResizeObserver(fitAspect).observe($("canvas"));
  const toSvg = (cx, cy) => { const p = svg.createSVGPoint(); p.x = cx; p.y = cy; return p.matrixTransform(svg.getScreenCTM().inverse()); };
  svg.addEventListener("wheel", (e) => {
    e.preventDefault();
    const p = toSvg(e.clientX, e.clientY), k = Math.exp(Math.max(-1, Math.min(1, e.deltaY * 0.0015)));
    const nw = Math.min(Math.max(vb.w * k, 200), 6000), f = nw / vb.w;
    vb = { x: p.x - (p.x - vb.x) * f, y: p.y - (p.y - vb.y) * f, w: vb.w * f, h: vb.h * f };
    setVB();
  }, { passive: false });

  // ---- drawing ----------------------------------------------------------------------------
  const el = (tag, attrs, text) => { const e = document.createElementNS(SVGNS, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); if (text !== undefined) e.textContent = text; return e; };
  const symbol = (nd) => {
    const { w, h } = sizeOf(nd), t = nd.type, g = el("g", {});
    const bubble = ["nand", "nor", "xnor", "not"].includes(t);
    const bw = bubble ? w - 8 : w;
    if (t === "in") g.append(el("path", { class: "body", d: `M0 0 H${w - 12} L${w} ${h / 2} L${w - 12} ${h} H0 Z` }));
    else if (t === "out") g.append(el("path", { class: "body", d: `M12 0 H${w} V${h} H12 L0 ${h / 2} Z` }));
    else if (t.startsWith("const")) g.append(el("rect", { class: "body", width: w, height: h, rx: 4 }));
    else if (t === "and" || t === "nand") g.append(el("path", { class: "body", d: `M0 0 H${bw / 2} A${bw / 2} ${h / 2} 0 0 1 ${bw / 2} ${h} H0 Z` }));
    else if (t === "or" || t === "nor" || t === "xor" || t === "xnor") {
      g.append(el("path", { class: "body", d: `M0 0 Q${bw * 0.55} 0 ${bw} ${h / 2} Q${bw * 0.55} ${h} 0 ${h} Q${bw * 0.28} ${h / 2} 0 0 Z` }));
      if (t === "xor" || t === "xnor") g.append(el("path", { class: "body", d: `M-7 0 Q${bw * 0.28 - 7} ${h / 2} -7 ${h}`, fill: "none" }));
    } else if (t === "not" || t === "buf") g.append(el("path", { class: "body", d: `M0 0 L${bw} ${h / 2} L0 ${h} Z` }));
    else if (t === "mux") {
      g.append(el("path", { class: "body", d: `M0 0 L${w} 14 L${w} ${h - 14} L0 ${h} Z` }));
      g.append(el("text", { x: 5, y: (h * 1) / 3 + 4 }, "0"), el("text", { x: 5, y: (h * 2) / 3 + 4 }, "1"));
    } else if (t === "dff" || t === "dffr") {
      g.append(el("rect", { class: "body", width: w, height: h, rx: 3 }));
      for (const pin of pinsOf(nd).ins) { const pp = pinPos({ ...nd, x: 0, y: 0 }, pin, false); if (pin !== "CLK") g.append(el("text", { x: 6, y: pp.y + 4 }, pin)); }
      const ck = pinPos({ ...nd, x: 0, y: 0 }, "CLK", false);
      g.append(el("path", { class: "body", d: `M0 ${ck.y - 6} L9 ${ck.y} L0 ${ck.y + 6}`, fill: "none" }));
      g.append(el("text", { x: w - 16, y: h / 2 + 4 }, "Q"));
    }
    if (bubble) g.append(el("circle", { class: "body", cx: w - 4, cy: h / 2, r: 4 }));
    if (t === "in" || t === "out") g.append(el("text", { x: t === "out" ? 18 : 6, y: h / 2 + 4 }, nd.name));

    if (!PORTS.includes(t)) {
      const kind = t === "dffr" ? "DFF+R" : t.toUpperCase();
      g.append(el("text", { class: "kind", x: 0, y: -4 }, kind));

  const route = (a, b) => {   // orthogonal wire: out pin -> midpoint x -> in pin

  let rubber = null;
  function draw() {
    svg.textContent = "";

    const connected = new Set(D.wires.map((w) => `${w.to.node}:${w.to.pin}`));
    const labelled = new Set();
    for (const w of D.wires) {

      g.append(symbol(nd));
      const p = pinsOf(nd);
      for (const pin of p.ins) {

  // ---- properties of the selection ----------------------------------------------------------
  const isIdent = (s) => /^[A-Za-z_][A-Za-z0-9_]*$/.test(s);
  function renderProps() {
    const box = $("props");
    if (document.activeElement && box.contains(document.activeElement)) return;  // do not disturb typing
    box.textContent = "";
    const what = document.createElement("div"); what.className = "what"; box.append(what);
    if (!selCount()) { what.textContent = _t("Nothing selected."); return; }
    if (selCount() > 1) { what.textContent = _t("{n} items selected", { n: selCount() }); return; }
    const nodes = byId();
    let nd = sel.nodes.size ? nodes[[...sel.nodes][0]] : null, viaWire = false;
    if (!nd) {   // a wire: its name is the name of the net = of the gate driving it
      const w = D.wires.find((x) => x.id === [...sel.wires][0]);
      nd = w && nodes[w.from.node];
      viaWire = true;
      what.textContent = _t("wire") + (nd ? ` ← ${nd.type === "in" ? nd.name : nd.label || nd.type.toUpperCase() + nd.id}` : "");
      if (!nd) return;
      if (nd.type === "in") { const p = document.createElement("div"); p.textContent = _t("This wire comes from input {name}: rename the input port.", { name: nd.name }); box.append(p); return; }
      if (nd.type.startsWith("const")) { const p = document.createElement("div"); p.textContent = _t("Constant wires have no name."); box.append(p); return; }
    } else what.textContent = nd.type === "in" || nd.type === "out" ? (nd.type === "in" ? _t("Input") : _t("Output"))
      : nd.type.startsWith("const") ? "const" : (nd.type === "dffr" ? "DFF+R" : nd.type.toUpperCase()) + nd.id;
    const field = (labelText, value, placeholder, onSet) => {
      const l = document.createElement("label"); l.textContent = labelText;
      const i = document.createElement("input"); i.type = "text"; i.value = value || ""; i.placeholder = placeholder || ""; i.id = "prop-name"; i.spellcheck = false;
      i.oninput = () => i.classList.toggle("bad", !!i.value && !isIdent(i.value));
      const apply = () => { const v = i.value.trim(); if (v && !isIdent(v)) return; onSet(v); commit(); draw(); };
      i.onchange = apply;
      i.onblur = () => setTimeout(renderProps);
      i.onkeydown = (e) => { if (e.key === "Enter") { apply(); i.blur(); } if (e.key === "Escape") i.blur(); };
      box.append(l, i);
    };
    if (nd.type === "in" || nd.type === "out") field(_t("Port name"), nd.name, "", (v) => { if (v) nd.name = v; });
    else if (!nd.type.startsWith("const")) {
      field(viaWire ? _t("Net name (all wires from this output)") : _t("Net name (the wire this gate drives)"), nd.label,
        _t("automatic") + `: ${nd.type === "dff" || nd.type === "dffr" ? "q" : nd.type}${nd.id}`, (v) => { if (v) nd.label = v; else delete nd.label; });
    }
    if (!viaWire && GATE2.includes(nd.type)) {
      const l = document.createElement("label"); l.textContent = _t("Inputs");
      const row = document.createElement("div"); row.className = "row";
      for (const n of [2, 3, 4]) {
        const b = document.createElement("button"); b.className = "btn" + ((nd.n || 2) === n ? " on" : ""); b.textContent = n;
        b.onclick = () => { nd.n = n; D.wires = D.wires.filter((w) => !(w.to.node === nd.id && pinsOf(nd).ins.indexOf(w.to.pin) < 0)); commit(); draw(); };
        row.append(b);
      }
      box.append(l, row);
    }
    if (!viaWire && nd.type.startsWith("const")) {
      const l = document.createElement("label"); l.textContent = _t("Value");
      const row = document.createElement("div"); row.className = "row";
      for (const v of ["0", "1"]) {
        const b = document.createElement("button"); b.className = "btn" + (nd.type === "const" + v ? " on" : ""); b.textContent = v;
        b.onclick = () => { nd.type = "const" + v; commit(); draw(); };
        row.append(b);
      }
      box.append(l, row);
    }
  }

  // ---- editing ---------------------------------------------------------------------------
  const usedNames = () => new Set(D.nodes.flatMap((n) => [n.name, n.label]).filter(Boolean));
  const uniqueName = (base, used = usedNames()) => {
    if (!used.has(base)) return base;
    const stem = base.replace(/\d+$/, "");
    for (let i = 1; ; i++) if (!used.has(stem + i)) return stem + i;
  };
  function addNode(type) {
    const c = { x: vb.x + vb.w / 2, y: vb.y + vb.h / 2 };
    const off = (D.nodes.length % 6) * 20;
    const nd = { id: D.seq++, type, x: Math.round((c.x - 40 + off) / 10) * 10, y: Math.round((c.y - 20 + off) / 10) * 10 };
    if (type === "in") nd.name = uniqueName(["a", "b", "c", "d", "clk"].find((n) => !usedNames().has(n)) || "in");
    if (type === "out") nd.name = uniqueName("y");
    if (GATE2.includes(type)) nd.n = 2;

    commit(); draw();
  }
  for (const b of document.querySelectorAll("[data-add]")) b.onclick = () => addNode(b.dataset.add);
  function removeSel() {
    if (!selCount()) return;
    D.nodes = D.nodes.filter((n) => !sel.nodes.has(n.id));
    D.wires = D.wires.filter((w) => !sel.wires.has(w.id) && !sel.nodes.has(w.from.node) && !sel.nodes.has(w.to.node));

  }
  function connect(a, b) {  // a, b: {node, pin, dir}

  }

  // ---- clipboard -------------------------------------------------------------------------
  let clip = null, pasteCount = 0;
  function copySel() {
    if (!sel.nodes.size) return 0;
    const nodes = D.nodes.filter((n) => sel.nodes.has(n.id));
    // wires inside the selection (both ends selected) travel with it
    const wires = D.wires.filter((w) => sel.nodes.has(w.from.node) && sel.nodes.has(w.to.node));
    clip = JSON.stringify({ veriview: "gate-editor-clip", nodes, wires });
    pasteCount = 0;
    try { localStorage.setItem(CLIP, clip); } catch (e) {}   // also between editor tabs

  }
  function paste() {
    let src = clip;

      if (nn.label) { nn.label = uniqueName(nn.label, used); used.add(nn.label); }

      D.nodes.push(nn); sel.nodes.add(nn.id);
    }
    for (const w of c.wires) {

  }
  const flash = (msg) => { $("status").textContent = msg; clearTimeout(flash.t); flash.t = setTimeout(generate, 1500); };

  // ---- pointer interaction ----------------------------------------------------------------
  let drag = null, spaceDown = false;
  svg.addEventListener("pointerdown", (e) => {
    const p = toSvg(e.clientX, e.clientY);
    const pinEl = e.target.closest && e.target.closest(".pin");
    const nodeEl = e.target.closest && e.target.closest(".node");
    const wireEl = e.target.closest && e.target.closest(".wire-hit");
    const add = e.shiftKey || e.ctrlKey || e.metaKey;
    if (e.button === 1 || spaceDown) {
      e.preventDefault();
      drag = { kind: "pan", x: e.clientX, y: e.clientY, vb: { ...vb }, k: vb.w / (svg.getBoundingClientRect().width || 1) };
      $("canvas").classList.add("panning");
    } else if (pinEl) {

      else {
        if (!sel.nodes.has(id)) { clearSel(); sel.nodes.add(id); }
        const nodes = D.nodes.filter((n) => sel.nodes.has(n.id));

        draw();
      }
    } else if (wireEl) {
      const id = +wireEl.dataset.wire;
      if (add) { if (sel.wires.has(id)) sel.wires.delete(id); else sel.wires.add(id); }
      else { clearSel(); sel.wires.add(id); }
      draw();
    } else {
      if (!add) clearSel();

  svg.addEventListener("pointermove", (e) => {
    if (!drag) return;

      const dx = Math.round((p.x - drag.start.x) / 10) * 10, dy = Math.round((p.y - drag.start.y) / 10) * 10;
      if (!dx && !dy && !drag.moved) return;

    } else if (drag.kind === "wire") {

      for (const h of svg.querySelectorAll(".pin.hot")) h.classList.remove("hot");

    } else if (drag.kind === "pan") {

      for (const [k, v] of Object.entries({ x, y, width: w, height: h })) rubber.el.setAttribute(k, v);

      for (const n of D.nodes) { const z = sizeOf(n); if (n.x >= x && n.y >= y && n.x + z.w <= x + w && n.y + z.h <= y + h) sel.nodes.add(n.id); }

    if (drag && drag.kind === "wire") {

    }
    if (drag && drag.kind === "move" && drag.moved) commit();

    if (drag && drag.kind === "move" && !drag.moved && selCount() > 1) { clearSel(); sel.nodes.add(drag.id); draw(); }

    drag = null;
  });
  svg.addEventListener("dblclick", (e) => {
    const target = (e.target.closest && (e.target.closest(".node") || e.target.closest(".wire-hit")));

    draw();
    const nd = target.dataset.node && byId()[+target.dataset.node];
    if (nd && nd.type.startsWith("const")) { nd.type = nd.type === "const0" ? "const1" : "const0"; commit(); draw(); return; }

  });
  const typing = (e) => e.target && e.target.matches && e.target.matches("input, textarea");
  window.addEventListener("keydown", (e) => {
    if (e.key === " " && !typing(e)) { spaceDown = true; $("canvas").classList.add("panning"); e.preventDefault(); return; }

    else if (mod && k === "x") { e.preventDefault(); const n = copySel(); if (n) { removeSel(); flash(_t("Cut {n} items.", { n })); } }

    else if (mod && k === "z" && !e.shiftKey) { e.preventDefault(); undo(); }

  });
  window.addEventListener("keyup", (e) => { if (e.key === " ") { spaceDown = false; $("canvas").classList.remove("panning"); } });

  // ---- Verilog generation (editor_core.js, inlined above) ---------------------------------
  function verilog() { return VVEditor.toVerilog(D, $("modname").value, _t); }
  const KW = /\b(module|endmodule|input|output|wire|reg|assign|always|posedge|negedge|if|else)\b/g;
  function generate() {
    const { text, warn, mod } = verilog();
    const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
    $("verilog").innerHTML = text.split("\n").map((l) => {
      const i = l.indexOf("//");
      const code = i >= 0 ? l.slice(0, i) : l, com = i >= 0 ? l.slice(i) : "";

    }).join("\n");

    const gates = D.nodes.filter((n) => !PORTS.includes(n.type)).length;
    $("status").innerHTML = D.nodes.length
      ? `<b>${esc(mod)}</b> · ${esc(_t("{n} gates, {m} wires", { n: gates, m: D.wires.length }))}` + (warn.length ? ` · ${esc(_t("{n} warning(s)", { n: warn.length }))}` : "")

  }

  $("modname").addEventListener("change", commit);

  // ---- files -----------------------------------------------------------------------------
  const download = (name, text, type) => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], { type }));
    a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  $("b-v").onclick = () => { const v = verilog(); download(`${v.mod}.v`, v.text, "text/plain"); };
  $("b-save").onclick = () => download(`${verilog().mod}.veriview.json`, JSON.stringify({ veriview: "gate-editor", version: 1, module: $("modname").value, ...D }, null, 1), "application/json");
  $("b-load").onclick = () => $("file").click();
  $("file").onchange = async () => {
    const f = $("file").files[0];

      const j = JSON.parse(await f.text());
      if (j.veriview !== "gate-editor" || !Array.isArray(j.nodes)) throw new Error();
      D = { nodes: j.nodes, wires: j.wires || [], seq: j.seq || 1 + Math.max(0, ...j.nodes.map((n) => n.id), ...(j.wires || []).map((w) => w.id)) };

    } catch (e) { alert(_t("Not a VeriView design file.")); }
    $("file").value = "";
  };
  $("b-new").onclick = () => { if (!D.nodes.length || confirm(_t("Delete the whole design?"))) { D = { nodes: [], wires: [], seq: 1 }; clearSel(); commit(); draw(); } };
  $("b-copy").onclick = async () => { try { await navigator.clipboard.writeText(verilog().text); flash(_t("Copied.")); } catch (e) {} };
  const api = async (path, body) => {
    const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json", "X-VeriView": "1" }, body: JSON.stringify(body) });
    return r.json();
  };
  $("b-open").onclick = async () => {
    if (!EDITOR || !EDITOR.launcher) { alert(_t("Saving and opening needs the launcher (run `veriview` or `veriview --editor`). Use Download Verilog instead.")); return; }
    const v = verilog();
    let name = prompt(_t("File name (in the launcher folder):"), `${v.mod}.v`);

  // ---- start -----------------------------------------------------------------------------
  try { const s = JSON.parse(localStorage.getItem(STORE) || "null"); if (s && s.nodes) { D = { nodes: s.nodes, wires: s.wires || [], seq: s.seq || 1 }; $("modname").value = s.module || "my_design"; } } catch (e) {}
  if (!D.nodes.length) {   // a small starting example: y = a & b
    D = { nodes: [{ id: 1, type: "in", name: "a", x: 120, y: 200 }, { id: 2, type: "in", name: "b", x: 120, y: 280 },
      { id: 3, type: "and", n: 2, x: 300, y: 230 }, { id: 4, type: "out", name: "y", x: 460, y: 235 }],
    wires: [{ id: 5, from: { node: 1, pin: "Y" }, to: { node: 3, pin: "A" } }, { id: 6, from: { node: 2, pin: "Y" }, to: { node: 3, pin: "B" } },
      { id: 7, from: { node: 3, pin: "Y" }, to: { node: 4, pin: "A" } }], seq: 8 };
  }
  last = snapshot(); updateUndo();
  // start with the drawing filling the view (not too zoomed in for tiny designs)
  const r = $("canvas").getBoundingClientRect(), asp = r.width && r.height ? r.height / r.width : 0.66;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const nd of D.nodes) { const z = sizeOf(nd); x0 = Math.min(x0, nd.x); y0 = Math.min(y0, nd.y); x1 = Math.max(x1, nd.x + z.w); y1 = Math.max(y1, nd.y + z.h); }
  if (isFinite(x0)) {
    const w = Math.max(560, (x1 - x0) + 160, ((y1 - y0) + 160) / asp);
    vb = { x: (x0 + x1) / 2 - w / 2, y: (y0 + y1) / 2 - (w * asp) / 2, w, h: w * asp };
  } else vb = { x: 0, y: 0, w: 900, h: 900 * asp };
  setVB();
  draw();
})();
</script>
