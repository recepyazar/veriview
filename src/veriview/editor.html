<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VeriView · Gate editor</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --border: #dde1e6; --text: #1d232b; --muted: #5f6b7a;
    --accent: #2563eb; --on-accent: #ffffff; --accent-soft: #e6eefc; --paper: #ffffff; --grid: #e3e6ea;
    --wire: #344054; --sel: #e8590c; --bad: #d92d20; --ok: #15a34a; --label: #0e7490;
  }
  :root[data-theme="dark"] {
    --bg: #111418; --panel: #181c21; --border: #2a3038; --text: #e6e9ed; --muted: #95a0ad;
    --accent: #6ea0ff; --on-accent: #0b1220; --accent-soft: #1c2a42; --paper: #15181c; --grid: #262c34;
    --wire: #c9d1db; --sel: #fb923c; --bad: #f97066; --ok: #4ade80; --label: #67e8f9;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111418; --panel: #181c21; --border: #2a3038; --text: #e6e9ed; --muted: #95a0ad;
      --accent: #6ea0ff; --on-accent: #0b1220; --accent-soft: #1c2a42; --paper: #15181c; --grid: #262c34;
      --wire: #c9d1db; --sel: #fb923c; --bad: #f97066; --ok: #4ade80; --label: #67e8f9;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: 190px 1fr 36%;
    grid-template-areas: "head head head" "pal canvas code" "foot foot foot";
    background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button, input, select { font: inherit; color: inherit; }
  header { grid-area: head; display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  header .brand { font-weight: 700; }
  header .brand small { color: var(--muted); font-weight: 400; margin-left: 4px; }
  header input { padding: 3px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel); width: 150px; }
  .spacer { flex: 1; }
  .btn { border: 1px solid var(--border); background: var(--panel); border-radius: 6px; padding: 4px 10px; cursor: pointer; white-space: nowrap; }
  .btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .btn:disabled { opacity: 0.45; cursor: default; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  .btn.primary:hover:not(:disabled) { color: var(--on-accent); filter: brightness(1.08); }
  .btn.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  header a.brand { color: inherit; text-decoration: none; font-weight: 700; }
  header a.brand:hover { color: var(--accent); }
  .seg { display: inline-flex; }
  .seg .btn { border-radius: 0; margin-left: -1px; }
  .seg .btn:first-child { border-radius: 6px 0 0 6px; margin-left: 0; }
  .seg .btn:last-child { border-radius: 0 6px 6px 0; }
  .doc { color: var(--muted); font-size: 13px; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .doc b { color: var(--text); font-weight: 600; }
  .doc .dirty { color: var(--sel); }
  .menu { position: relative; }
  .menu-pop { position: absolute; right: 0; top: calc(100% + 4px); z-index: 30; min-width: 220px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 8px; padding: 4px; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18); }
  .menu-pop .btn { display: block; width: 100%; text-align: left; border: 0; padding: 6px 10px; }
  .menu-pop .btn:hover { background: var(--accent-soft); }
  .menu-pop hr { border: 0; border-top: 1px solid var(--border); margin: 4px 0; }
  aside { grid-area: pal; background: var(--panel); border-right: 1px solid var(--border); padding: 10px; overflow: auto; }
  aside h3 { margin: 6px 0; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  aside .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 10px; }
  aside .btn { padding: 6px 4px; font-size: 13px; }
  aside .help { font-size: 12px; color: var(--muted); line-height: 1.5; margin-top: 10px; }
  #props { border: 1px solid var(--border); border-radius: 8px; padding: 8px; font-size: 13px; margin-bottom: 6px; }
  #props .what { color: var(--muted); margin-bottom: 6px; }
  #props label { display: block; color: var(--muted); font-size: 12px; margin: 6px 0 2px; }
  #props input[type="text"] { width: 100%; padding: 3px 6px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); font-family: ui-monospace, Menlo, monospace; }
  #props input.bad { border-color: var(--bad); }
  #props .row { display: flex; gap: 4px; }
  #props .row .btn { flex: 1; padding: 2px 0; }
  #canvas { grid-area: canvas; position: relative; background: var(--paper); overflow: hidden; touch-action: none; }
  #canvas.panning { cursor: grab; }
  #canvas svg { width: 100%; height: 100%; display: block; user-select: none; }
  .node .body { fill: var(--paper); stroke: var(--wire); stroke-width: 2; }
  .node.sel .body { stroke: var(--sel); stroke-width: 3; }
  .node text { fill: var(--text); font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; pointer-events: none; }
  .node text.kind { fill: var(--muted); font-size: 10px; }
  .node text.lbl, text.wlbl { fill: var(--label); font: bold 11px ui-monospace, SFMono-Regular, Menlo, monospace; pointer-events: none; }
  .node { cursor: move; }
  .pin { fill: var(--paper); stroke: var(--wire); stroke-width: 1.5; cursor: crosshair; }
  .pin:hover, .pin.hot { fill: var(--accent); stroke: var(--accent); }
  .pin.free { stroke: var(--bad); }
  .wire { fill: none; stroke: var(--wire); stroke-width: 2; }
  .wire-hit { fill: none; stroke: transparent; stroke-width: 10; cursor: pointer; }
  .wire.bus { stroke-width: 4; }
  .wire.sel { stroke: var(--sel); stroke-width: 3; }
  .wire.bus.sel { stroke-width: 5; }
  text.wbits { fill: var(--muted); font: 10px ui-monospace, SFMono-Regular, Menlo, monospace; pointer-events: none; }
  .node text.pinname { font-size: 10px; fill: var(--muted); }
  .node .blk .body { fill: var(--accent-soft); }
  #props input[type="number"] { width: 100%; padding: 3px 6px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); font-family: ui-monospace, Menlo, monospace; }
  .wire.temp { stroke: var(--accent); stroke-dasharray: 5 4; }
  .tag .body { fill: var(--accent-soft); }
  .handle { fill: var(--paper); stroke: var(--sel); stroke-width: 2; cursor: ew-resize; }
  .handle.v { cursor: ns-resize; }
  .inline-edit { position: absolute; z-index: 5; padding: 2px 6px; border: 2px solid var(--accent); border-radius: 6px;
    background: var(--panel); color: var(--text); font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; width: 130px; }
  .inline-edit.bad { border-color: var(--bad); }
  /* simulation */
  .wire.on { stroke: var(--ok); }
  .wire.bus.on { stroke: var(--accent); }
  .node.on .body { fill: color-mix(in srgb, var(--ok) 28%, var(--paper)); }
  text.wval { fill: var(--accent); font: bold 11px ui-monospace, SFMono-Regular, Menlo, monospace; pointer-events: none; }
  .node text.nval { fill: var(--ok); font: bold 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
  body.sim .node.port-in { cursor: pointer; }
  #simbar { position: absolute; left: 10px; top: 10px; z-index: 4; display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    padding: 6px 8px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; font-size: 13px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12); max-width: calc(100% - 20px); }
  #simbar select { padding: 2px 4px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel); }
  #simbar .hint { color: var(--muted); font-size: 12px; }
  #sim-cycle { color: var(--muted); min-width: 5em; }
  .rubber { fill: var(--accent); fill-opacity: 0.08; stroke: var(--accent); stroke-dasharray: 4 3; }
  #code { grid-area: code; display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-left: 1px solid var(--border); }
  #code .head { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-bottom: 1px solid var(--border); font-size: 13px; }
  #verilog { flex: 1; margin: 0; overflow: auto; padding: 10px 12px; font: 12.5px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre; }
  #warnings { border-top: 1px solid var(--border); padding: 6px 10px; font-size: 12.5px; max-height: 25%; overflow: auto; }
  #warnings:empty { display: none; }
  #warnings div { color: var(--bad); }
  #verilog .k { color: #7c3aed; font-weight: 600; } #verilog .c { color: #6b7280; font-style: italic; } #verilog .n { color: #0e7490; }
  footer { grid-area: foot; padding: 5px 12px; color: var(--muted); border-top: 1px solid var(--border); background: var(--panel); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  footer b { color: var(--text); }
  [hidden] { display: none !important; }
  @media (max-width: 860px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto auto 60vh auto auto; grid-template-areas: "head" "pal" "canvas" "code" "foot"; }
    aside .grid { grid-template-columns: repeat(4, 1fr); }
    #code { max-height: 45vh; }
  }
</style>
</head>
<body>
<header>
  <a class="brand" id="brand" href="/" title="Start page: all designs of the folder">VeriView</a>
  <div class="seg" role="group" aria-label="Mode">
    <button class="btn" id="mode-view" title="Save and look at the design in the viewer (schematic, simulation, timing, FSMs)" data-t>👁 View</button>
    <button class="btn on" id="mode-edit" title="You are editing the drawing" data-t>✎ Edit</button>
  </div>
  <span class="doc" id="doc-name"></span>
  <label><span data-t>Module</span> <input id="modname" value="my_design" spellcheck="false"></label>
  <button class="btn" id="b-undo" title="Undo (Ctrl+Z)">↶</button>
  <button class="btn" id="b-redo" title="Redo (Ctrl+Y)">↷</button>
  <span class="spacer"></span>
  <button class="btn" id="b-sim" title="Simulation: click inputs to change them, clock the registers, watch the wires" data-t>▶ Simulate</button>
  <button class="btn primary" id="b-save" title="Save (Ctrl+S): the Verilog file, with the drawing next to it" data-t>Save</button>
  <div class="menu">
    <button class="btn" id="b-more" title="More" aria-haspopup="true">⋯</button>
    <div class="menu-pop" id="more" hidden>
      <button class="btn" id="b-new" data-t>+ New drawing</button>
      <button class="btn" id="b-saveas" data-t>Save as…</button>
      <hr>
      <button class="btn" id="b-load" title="Load a drawing (.veriview.json) from your computer" data-t>Open a drawing file…</button>
      <button class="btn" id="b-dl" data-t>⤓ Drawing (.json)</button>
      <button class="btn" id="b-v" data-t>⤓ Verilog (.v)</button>
      <hr>
      <button class="btn" id="btn-lang" title="Language / Dil">Türkçe</button>
      <button class="btn" id="btn-theme" title="Toggle light/dark theme" data-t>◐ Light / dark</button>
    </div>
  </div>
  <input type="file" id="file" accept=".json,application/json" hidden>
</header>
<aside>
  <h3 data-t>Ports</h3>
  <div class="grid">
    <button class="btn" data-add="in" data-t>Input</button><button class="btn" data-add="out" data-t>Output</button>
    <button class="btn" data-add="const0">0</button><button class="btn" data-add="const1">1</button>
    <button class="btn" data-add="const" title="Constant with several bits (value in the selection panel)" style="grid-column: span 2" data-t>N-bit constant</button>
    <button class="btn" data-add="tag" title="Net label: labels with the same name are connected (no wire needed)" style="grid-column: span 2" data-t>🏷 Label</button>
  </div>
  <h3 data-t>Gates</h3>
  <div class="grid">
    <button class="btn" data-add="not">NOT</button><button class="btn" data-add="buf">BUF</button>
    <button class="btn" data-add="and">AND</button><button class="btn" data-add="or">OR</button>
    <button class="btn" data-add="nand">NAND</button><button class="btn" data-add="nor">NOR</button>
    <button class="btn" data-add="xor">XOR</button><button class="btn" data-add="xnor">XNOR</button>
    <button class="btn" data-add="mux">MUX</button>
  </div>
  <h3 data-t>Flip-flops</h3>
  <div class="grid">
    <button class="btn" data-add="dff">DFF</button><button class="btn" data-add="dffr" title="DFF with active-low asynchronous reset">DFF+R</button>
  </div>
  <h3 data-t>Blocks</h3>
  <div class="grid">
    <button class="btn" data-add="add" title="Adder: S = A + B + CIN, COUT = carry">ADD</button>
    <button class="btn" data-add="sub" title="Subtractor: Y = A - B, BOUT = borrow (A &lt; B)">SUB</button>
    <button class="btn" data-add="cmp" title="Comparator (unsigned): EQ, LT, GT">CMP</button>
    <button class="btn" data-add="muxn" title="Multiplexer with N data inputs: Y = D[S]">MUX N:1</button>
    <button class="btn" data-add="dec" title="Decoder: one-hot output, Y = 1 &lt;&lt; A">DEC</button>
    <button class="btn" data-add="reg" title="Register: Q &lt;= D on the clock edge when EN = 1; RST_N clears it (EN, RST_N optional)">REG</button>
    <button class="btn" data-add="cnt" title="Counter: Q &lt;= Q + 1 on the clock edge when EN = 1; RST_N clears it (EN, RST_N optional)">CNT</button>
    <button class="btn" data-add="split" title="Splitter: a bus into single bits (B0 = least significant bit)" data-t>Split</button>
    <button class="btn" data-add="merge" title="Merger: single bits into a bus (B0 = least significant bit)" data-t>Merge</button>
  </div>
  <h3 data-t>Selection</h3>
  <div id="props"></div>
  <div class="help" id="help"></div>
</aside>
<div id="canvas">
  <div id="simbar" hidden>
    <label for="sim-clk" data-t>Clock</label> <select id="sim-clk"></select>
    <button class="btn" id="sim-step" title="One clock cycle (rising and falling edge)" data-t>Step ⏵</button>
    <button class="btn" id="sim-auto" title="Clock automatically" data-t>▶ Run</button>
    <select id="sim-hz" title="Clock speed"><option value="1">1 Hz</option><option value="2" selected>2 Hz</option><option value="5">5 Hz</option><option value="10">10 Hz</option><option value="30">30 Hz</option></select>
    <button class="btn" id="sim-reset" title="Clear all registers" data-t>Reset</button>
    <span id="sim-cycle"></span>
    <span class="hint" data-t>Click an input to change it.</span>
  </div>
</div>
<section id="code">
  <div class="head"><b>Verilog</b><span class="spacer"></span><button class="btn" id="b-copy" data-t>Copy</button></div>
  <pre id="verilog"></pre>
  <div id="warnings"></div>
</section>
<footer id="status"></footer>
<script>
/*__EDITOR_CORE__*/
</script>

    else if (clocks.length) pick.value = clocks[0].id;
    $("sim-step").disabled = $("sim-auto").disabled = !ins.length;
    $("sim-cycle").textContent = _t("cycle {n}", { n: SIM.cycle }) + (SIM.unstable ? " · " + _t("oscillates (combinational loop)") : "");
  }
  const stopAuto = () => { clearInterval(simTimer); simTimer = null; $("sim-auto").textContent = _t("▶ Run"); };
  const simStep = () => { const id = +$("sim-clk").value; if (!id) return; SIM.clock(id); draw(); };
  $("sim-step").onclick = simStep;
  $("sim-auto").onclick = () => {
    if (simTimer) return stopAuto();
    simTimer = setInterval(simStep, 1000 / +$("sim-hz").value);
    $("sim-auto").textContent = _t("⏸ Pause");
  };
  $("sim-hz").onchange = () => { if (simTimer) { stopAuto(); $("sim-auto").click(); } };
  $("sim-reset").onclick = () => { SIM.reset(); draw(); };
  $("b-sim").onclick = () => {
    if (SIM) { stopAuto(); SIM = null; } else SIM = VVEditor.createSim(D);
    document.body.classList.toggle("sim", !!SIM);
    $("simbar").hidden = !SIM;
    $("b-sim").classList.toggle("on", !!SIM);
    $("b-sim").textContent = SIM ? _t("■ Stop simulation") : _t("▶ Simulate");
    draw();
  };

  // ---- Verilog generation (editor_core.js, inlined above) ---------------------------------
  function verilog() { return VVEditor.toVerilog(D, $("modname").value, _t); }
  const KW = /\b(module|endmodule|input|output|wire|reg|assign|always|posedge|negedge|if|else)\b/g;
  function generate() {
    const { text, warn, mod } = verilog();
    const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
    $("verilog").innerHTML = text.split("\n").map((l) => {
      const i = l.indexOf("//");
      const code = i >= 0 ? l.slice(0, i) : l, com = i >= 0 ? l.slice(i) : "";
      return esc(code).replace(KW, '<span class="k">$1</span>').replace(/\b\d+'[bd]\d+\b/g, '<span class="n">$&</span>') + (com ? `<span class="c">${esc(com)}</span>` : "");
    }).join("\n");
    $("warnings").innerHTML = warn.map((w) => `<div>⚠ ${esc(w)}</div>`).join("");
    const gates = D.nodes.filter((n) => !PORTS.includes(n.type)).length;
    $("status").innerHTML = D.nodes.length
      ? `<b>${esc(mod)}</b> · ${esc(_t("{n} gates, {m} wires", { n: gates, m: D.wires.length }))}` + (warn.length ? ` · ${esc(_t("{n} warning(s)", { n: warn.length }))}` : "")
      : esc(_t("Start: add an input, a gate and an output, then drag from pin to pin."));
  }
  $("modname").addEventListener("input", generate);
  $("modname").addEventListener("change", commit);

  // ---- files -----------------------------------------------------------------------------
  const download = (name, text, type) => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], { type }));
    a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  $("b-v").onclick = () => { const v = verilog(); download(`${v.mod}.v`, v.text, "text/plain"); };
  $("b-dl").onclick = () => download(`${verilog().mod}.veriview.json`, JSON.stringify({ veriview: "gate-editor", version: 1, module: $("modname").value, ...D }, null, 1), "application/json");
  $("b-load").onclick = () => $("file").click();
  $("file").onchange = async () => {
    const f = $("file").files[0];
    if (!f) return;
    try {
      const j = JSON.parse(await f.text());
      if (j.veriview !== "gate-editor" || !Array.isArray(j.nodes)) throw new Error();
      if (!discardOk()) return;
      setDesign(j); FILE = VFILE = null; savedSnap = null; resetHistory(); location.hash = "";
    } catch (e) { alert(_t("Not a VeriView design file.")); }
    $("file").value = "";
  };
  $("b-copy").onclick = async () => { try { await navigator.clipboard.writeText(verilog().text); flash(_t("Copied.")); } catch (e) {} };
  const api = async (path, body) => {
    const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json", "X-VeriView": "1" }, body: JSON.stringify(body) });
    return r.json();
  };
  function setDesign(j) {
    D = { nodes: j.nodes || [], wires: j.wires || [], seq: j.seq || 1 + Math.max(0, ...(j.nodes || []).map((n) => n.id), ...(j.wires || []).map((w) => w.id)) };
    $("modname").value = j.module || "my_design";
    clearSel();
  }
  function resetHistory() { hist.undo.length = hist.redo.length = 0; last = snapshot(); saveDraft(); updateUndo(); fitAll(); draw(); }
  const discardOk = () => !isDirty() || !D.nodes.length || confirm(_t("The current drawing has unsaved changes. Discard them?"));
  function pushRecent() {
    if (!FILE) return;
    try {
      const k = "veriview-recent:" + (EDITOR.root || ""), url = "/editor?file=" + encodeURIComponent(FILE);
      const items = JSON.parse(localStorage.getItem(k) || "[]").filter((x) => x.url !== url);
      items.unshift({ url, title: (VFILE || FILE).split("/").pop(), kind: "editor", time: Date.now() });
      localStorage.setItem(k, JSON.stringify(items.slice(0, 10)));
    } catch (e) {}
  }
  // Save: <name>.v (generated Verilog) and <name>.veriview.json (the drawing) in the folder
  async function saveDrawing(askName = false) {
    if (!EDITOR || !EDITOR.launcher) { alert(_t("Saving needs the launcher (run `veriview`). Use ⋯ → Verilog instead.")); return false; }
    const v = verilog();
    let path = askName ? null : VFILE, overwrite = !!path;
    if (!path) {
      path = prompt(_t("Save as (file name in the folder; the drawing is saved next to it):"), VFILE || `${v.mod}.v`);
      if (!path) return false;
    }
    const design = { module: $("modname").value, nodes: D.nodes, wires: D.wires, seq: D.seq };
    let r = await api("/api/drawing/save", { path, text: v.text, design, overwrite });
    if (r.exists) {
      if (!confirm(_t("{f} exists. Overwrite?", { f: r.path }))) return false;
      r = await api("/api/drawing/save", { path, text: v.text, design, overwrite: true });
    }
    if (r.error) { alert(r.error); return false; }
    FILE = r.drawing; VFILE = r.path; savedSnap = snapshot(); saveDraft(); renderTitle();
    history.replaceState(null, "", "/editor?file=" + encodeURIComponent(FILE));
    pushRecent();
    flash(_t("Saved {f}", { f: VFILE }));
    return true;
  }
  $("b-save").onclick = () => saveDrawing();
  $("b-saveas").onclick = () => saveDrawing(true);
  $("b-new").onclick = () => { if (discardOk()) location.href = "/editor?new=1"; };
  // View: save, then open the Verilog in the viewer (same tab: Back returns to the drawing)
  $("mode-view").onclick = async () => {
    if ((isDirty() || !VFILE) && !(await saveDrawing())) return;
    location.href = "/view?f=" + encodeURIComponent(VFILE);
  };
  $("mode-edit").onclick = () => {};
  $("b-more").onclick = (e) => { e.stopPropagation(); $("more").hidden = !$("more").hidden; };
  document.addEventListener("click", (e) => { if (!e.target.closest || !e.target.closest("#more")) $("more").hidden = true; });
  window.addEventListener("beforeunload", (e) => { if (isDirty() && D.nodes.length && VFILE) { e.preventDefault(); e.returnValue = ""; } });

  // ---- start -----------------------------------------------------------------------------
  //   /editor?file=x.veriview.json   a saved drawing      /editor?new=1   an empty drawing
  //   /editor?f=<files>&module=m     a module of a design, converted to gates (from the viewer)
  //   /editor                        the last drawing of this browser (also with unsaved changes)
  let draft = null;
  try { draft = JSON.parse(localStorage.getItem(STORE) || "null"); } catch (e) {}
  const qs = new URLSearchParams(location.search);
  const STARTER = { module: "my_design", nodes: [{ id: 1, type: "in", name: "a", x: 120, y: 200 }, { id: 2, type: "in", name: "b", x: 120, y: 280 },
    { id: 3, type: "and", n: 2, x: 300, y: 230 }, { id: 4, type: "out", name: "y", x: 460, y: 235 }],
  wires: [{ id: 5, from: { node: 1, pin: "Y" }, to: { node: 3, pin: "A" } }, { id: 6, from: { node: 2, pin: "Y" }, to: { node: 3, pin: "B" } },
    { id: 7, from: { node: 3, pin: "Y" }, to: { node: 4, pin: "A" } }], seq: 8 };
  const draftUnsaved = draft && draft.nodes && draft.nodes.length && !draft.clean;
  const useDraft = () => { setDesign(draft); FILE = draft.file || null; VFILE = draft.vfile || null; savedSnap = draft.clean ? snapshot() : null; };
  function fitAll() {   // the drawing fills the view (not too zoomed in for tiny designs)
    const r = $("canvas").getBoundingClientRect(), asp = r.width && r.height ? r.height / r.width : 0.66;
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const nd of D.nodes) { const z = sizeOf(nd); x0 = Math.min(x0, nd.x - 30); y0 = Math.min(y0, nd.y - 20); x1 = Math.max(x1, nd.x + z.w); y1 = Math.max(y1, nd.y + z.h); }
    if (isFinite(x0)) {
      const w = Math.min(Math.max(560, (x1 - x0) + 160, ((y1 - y0) + 160) / asp), 6000);
      vb = { x: (x0 + x1) / 2 - w / 2, y: (y0 + y1) / 2 - (w * asp) / 2, w, h: w * asp };
    } else vb = { x: 0, y: 0, w: 900, h: 900 * asp };
    setVB();
  }
  const keepDraft = () => draftUnsaved && !confirm(_t("The last drawing ({f}) has unsaved changes. Discard them?", { f: draft.vfile || _t("unsaved drawing") }));
  async function start() {
    const file = qs.get("file");
    if (file && EDITOR && EDITOR.launcher) {
      if (draft && draft.file === file && draftUnsaved) { useDraft(); flash(_t("Unsaved changes restored.")); }
      else {
        if (draftUnsaved && draft.file !== file && keepDraft()) { useDraft(); }
        else {
          const r = await api("/api/drawing/load", { path: file });
          if (r.error) { alert(r.error); location.href = "/"; return; }
          setDesign(r.design); FILE = r.path; VFILE = r.verilog || file.replace(/\.veriview\.json$/, ".v"); savedSnap = snapshot();
        }
      }
      pushRecent();
    } else if (qs.get("new")) {
      if (keepDraft()) useDraft();
      else { setDesign({ module: "my_design", nodes: [], wires: [], seq: 1 }); FILE = VFILE = null; savedSnap = snapshot(); }
    } else if ((qs.get("f") || qs.get("build")) && EDITOR && EDITOR.launcher) {
      if (keepDraft()) useDraft();
      else {
        const m = qs.get("module") || "";
        $("status").textContent = _t("Converting {m} to gates…", { m });
        const r = await api("/api/to_editor", qs.get("build") ? { id: qs.get("build"), module: m } : { files: qs.getAll("f"), module: m });
        if (r.error) { alert(r.error); history.back(); return; }
        setDesign({ ...r, module: r.module }); FILE = VFILE = null; savedSnap = null;
        const gates = r.nodes.filter((n) => !PORTS.includes(n.type)).length;
        const notes = (r.warn || []).map((w) => { const x = /^ports wider than (\d+) bits split into one port per bit: (.*)$/.exec(w); return x ? _t("ports wider than {n} bits split into one port per bit: {p}", { n: x[1], p: x[2] }) : w; });
        setTimeout(() => { $("status").textContent = [_t("{m}: {n} gates and flip-flops — Save keeps it as a new file", { m: r.module, n: gates }), ...notes].join(" · "); clearTimeout(flash.t); flash.t = setTimeout(generate, 6000); });
      }
    } else if (draft && draft.nodes) useDraft();
    else { setDesign(STARTER); savedSnap = null; }
    history.replaceState(null, "", FILE ? "/editor?file=" + encodeURIComponent(FILE) : "/editor");
    resetHistory();
  }
  if (EDITOR && !EDITOR.launcher) $("brand").removeAttribute("href");
  start();
})();
</script>
</body>
</html>
